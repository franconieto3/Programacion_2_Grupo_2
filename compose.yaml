# Levanta la API y su base de datos con un solo comando:
#   docker compose up -d --build
# La app completa queda en http://localhost:8080 y la API en
# http://localhost:8000 (documentacion en /docs).
services:
  db:
    image: postgres:16
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: eventos
    volumes:
      # Volumen con nombre: los datos sobreviven a `docker compose down`.
      - pgdata:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    healthcheck:
      # La API espera a que PostgreSQL acepte conexiones antes de migrar.
      test: ["CMD-SHELL", "pg_isready -U postgres -d eventos"]
      interval: 5s
      timeout: 5s
      retries: 10

  api:
    build: ./backend
    ports:
      - "8000:8000"
    depends_on:
      db:
        condition: service_healthy
    environment:
      # El host es el nombre del servicio (db), no localhost.
      DATABASE_URL: postgresql+asyncpg://postgres:postgres@db:5432/eventos
      # Valores de desarrollo. En produccion se definen en el proveedor.
      JWT_SECRET_KEY: solo-para-desarrollo-cambiar-en-produccion
      COOKIE_SECURE: "false"

  web:
    # Build del frontend servido por nginx, que reenvia /api a la API. Es la
    # misma topologia que en el PaaS: la app completa queda en http://localhost:8080.
    build: ./frontend
    ports:
      - "8080:8080"
    depends_on:
      - api
    environment:
      # Sin barra final. En el PaaS, la URL interna o publica de la API.
      API_UPSTREAM: http://api:8000

volumes:
  pgdata:
