# Integracion continua: corre en cada push y en cada pull request.
# - backend: instala las dependencias con Poetry y ejecuta los tests.
# - frontend: instala las dependencias, corre el linter y verifica el build.
# - docker: construye las imagenes, levanta el compose y prueba la app
#   completa a traves de nginx (las imagenes no se publican).
name: Pipeline

on: [push, pull_request]

jobs:
  backend:
    name: Tests del backend
    runs-on: ubuntu-latest

    # El proyecto Python vive en backend/, no en la raiz del repositorio.
    defaults:
      run:
        working-directory: backend

    steps:
      - name: Copiar los archivos del repositorio
        uses: actions/checkout@v5

      - name: Instalar Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.13'

      - name: Instalar Poetry
        run: pipx install poetry

      - name: Instalar dependencias
        run: poetry install

      # Los tests usan SQLite en memoria y dobles de test: no necesitan
      # PostgreSQL ni variables de entorno (Settings tiene valores por defecto).
      - name: Ejecutar tests
        run: poetry run pytest

  frontend:
    name: Lint y build del frontend
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: frontend

    steps:
      - name: Copiar los archivos del repositorio
        uses: actions/checkout@v5

      - name: Instalar Node.js
        uses: actions/setup-node@v5
        with:
          node-version: '22'

      - name: Instalar dependencias
        run: npm ci

      - name: Ejecutar linter
        run: npm run lint

      - name: Verificar el build
        run: npm run build

  docker:
    name: Imagenes Docker
    runs-on: ubuntu-latest

    steps:
      - name: Copiar los archivos del repositorio
        uses: actions/checkout@v5

      # Construye las imagenes de backend/ y frontend/. Falla si un Dockerfile
      # esta roto o si poetry.lock quedo desactualizado respecto de
      # pyproject.toml (lo exporta el Dockerfile del backend).
      - name: Construir las imagenes y levantar el compose
        run: docker compose up -d --build

      # La API corre las migraciones al arrancar: se reintenta hasta que
      # responda. Todo pasa por nginx (puerto 8080), como en produccion.
      - name: Probar la app a traves de nginx
        run: |
          curl --fail --silent --show-error --retry 30 --retry-delay 2 --retry-all-errors \
            --output /dev/null http://localhost:8080/api/categorias
          # El frontend y una ruta profunda de la SPA devuelven index.html.
          curl --fail --silent --show-error http://localhost:8080/ | grep -q '<div id="root">'
          curl --fail --silent --show-error http://localhost:8080/mis-eventos | grep -q '<div id="root">'
          # El login setea la cookie del refresh token con el path reescrito por nginx.
          curl --fail --silent --show-error --output /dev/null \
            -X POST http://localhost:8080/api/auth/register \
            -H 'Content-Type: application/json' \
            -d '{"email":"ci@example.com","password":"ci-12345678","nombre":"CI","apellido":"Pipeline"}'
          curl --fail --silent --show-error --output /dev/null --dump-header headers.txt \
            -X POST http://localhost:8080/api/auth/login \
            -H 'Content-Type: application/json' \
            -d '{"email":"ci@example.com","password":"ci-12345678"}'
          grep -qi '^set-cookie: refresh_token=.*Path=/api/auth' headers.txt

      - name: Logs de los contenedores (si algo fallo)
        if: failure()
        run: docker compose logs

      - name: Bajar el compose
        if: always()
        run: docker compose down -v
